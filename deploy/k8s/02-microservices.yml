# ==============================================================================
# 02. MICROSERVICES TIER
# ==============================================================================
# BEST PRACTICE: 
# Microservices bersifat stateless. Mereka menggunakan Deployment biasa.
# Kita wajib menyertakan:
# 1. Resource Limits: Agar satu service error tidak memakan semua RAM server (OOM).
# 2. Probes (Readiness/Liveness): Agar K8s tahu kapan pod siap menerima trafik atau kapan pod mati.
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  labels:
    app: account-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
        - name: account-service
          # Asumsi image dibangun secara lokal dan didaftarkan di minikube/registry
          image: localhost/bank-account-service:latest
          imagePullPolicy: Never # Gunakan image lokal untuk tahap development
          ports:
            - containerPort: 8083
            - containerPort: 9001
              name: metrics
          env:
            - name: DB_HOST
              value: "account-db" # DNS Internal K8s akan otomatis mengarah ke Service account-db
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "postgres"
            - name: DB_NAME
              value: "account_db"
            - name: PORT
              value: "8083"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          # Mengecek apakah port gRPC terbuka
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
spec:
  type: ClusterIP
  selector:
    app: account-service
  ports:
    - name: grpc
      port: 8083
      targetPort: 8083
    - name: metrics
      port: 9001
      targetPort: 9001

# ==============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: third-party-adapter
  labels:
    app: third-party-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: third-party-adapter
  template:
    metadata:
      labels:
        app: third-party-adapter
    spec:
      containers:
        - name: adapter
          image: localhost/bank-third-party-adapter:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8084 # gRPC
            - containerPort: 8081 # HTTP
          env:
            - name: GRPC_PORT
              value: "8084"
            - name: HTTP_PORT
              value: "8081"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: adapter-service
spec:
  type: ClusterIP
  selector:
    app: third-party-adapter
  ports:
    - name: grpc
      port: 8084
      targetPort: 8084
    - name: http
      port: 8081
      targetPort: 8081

# ==============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transfer-service
  labels:
    app: transfer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transfer-service
  template:
    metadata:
      labels:
        app: transfer-service
    spec:
      containers:
        - name: transfer-service
          image: localhost/bank-transfer-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082 # gRPC
            - containerPort: 8080 # HTTP
            - containerPort: 9002 # Prometheus Metrics
              name: metrics
          env:
            - name: DB_HOST
              value: "transfer-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "postgres"
            - name: DB_NAME
              value: "transfer_db"
            - name: ACCOUNT_SERVICE_ADDR
              value: "account-service:8083" # K8s DNS resolution
            - name: VENDOR_ADAPTER_ADDR
              value: "adapter-service:8084" # Mengarah ke Third-Party Adapter
            - name: JAVA_MQ_ADAPTER_URL
              value: "http://java-mq-adapter.core.svc.cluster.local:8085/api/mq/publish" # Contoh FQDN ke sistem Core Java MQ
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: transfer-service
spec:
  type: ClusterIP
  selector:
    app: transfer-service
  ports:
    - name: grpc
      port: 8082
      targetPort: 8082
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9002
      targetPort: 9002
