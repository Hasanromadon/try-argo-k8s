name: Core Banking CI Pipeline (GitHub Actions)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    name: Run Unit Tests and Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run Go Test
        run: go test ./... -v

      - name: Run Go Vet
        run: go vet ./...

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Account Service
        run: docker build -t banking/account-service:${{ github.sha }} -f services/account-service/Containerfile .

      - name: Build Transfer Service
        run: docker build -t banking/transfer-service:${{ github.sha }} -f services/transfer-service/Containerfile .

      - name: Build Adapter
        run: docker build -t banking/third-party-adapter:${{ github.sha }} -f services/third-party-adapter/Containerfile .
